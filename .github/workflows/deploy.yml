name: Deploy decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# GitHub Pages serves a single artifact, so every deck is built and assembled in one job.
# Add new decks to DECKS.
env:
  DECKS: beyond-the-cul-de-sac career-quest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # videos (*.mp4) are stored in Git LFS

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build decks and assemble site
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          for deck in $DECKS; do
            (cd "$deck" && npm install && npm run build)
            mkdir -p "_site/$deck"
            cp -r "$deck/dist/." "_site/$deck/"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
